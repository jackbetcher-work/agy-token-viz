[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-token-viz"
version = "0.1.0"
description = "Real-time CLI token usage visualizer by activity category for Antigravity CLI (agy) and Jetski CLI (jetski)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "huggingface_hub>=0.24.0",
    "llama-cpp-python>=0.3.0",
    "sentencepiece>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agy-token-viz = "agy_token_viz.cli:main"
jetski-token-viz = "agy_token_viz.cli:main_jetski"
token-viz = "agy_token_viz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agy_token_viz = ["assets/*.model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
